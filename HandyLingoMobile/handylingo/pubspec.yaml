name: handylingo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter 
  flutter_riverpod: ^3.1.0
  google_fonts: ^6.3.3
  url_launcher: ^6.1.10
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.12.0
  bcrypt: ^1.2.0
  flutter_svg: ^1.1.6
  speech_to_text: ^7.3.0
  permission_handler: ^11.3.1
  camera: ^0.10.0+1
  image_picker: ^0.8.7+5
  shared_preferences: ^2.1.0
  google_sign_in: ^6.2.1
  path_provider: ^2.0.15
  cupertino_icons: ^1.0.8
  change_notifier: ^0.28.0
  webview_flutter: ^4.4.2
  http: ^1.1.0 
  uuid: ^4.3.3
  # --- AI & POSE DETECTION PACKAGES ---
  tflite_flutter: ^0.12.0
  
  video_player: ^2.8.2
  webview_flutter_android: ^3.15.0
  webview_flutter_wkwebview: ^3.11.0
  image: ^4.1.3 # Used to resize/compress images before sending
  flutter_tts: ^4.0.2 # Text-to-Speech package
  google_mlkit_pose_detection: ^0.12.0
  google_mlkit_commons: ^0.8.1  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_vector_icons: ^2.0.0
  flutter_launcher_icons: ^0.13.1 

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/handylingologo.png
    - assets/images/google.png
    - assets/labels.txt
    # Ensure this matches the filename in your assets folder exactly!
    - assets/sign_language_model.tflite
    - assets/model_unquant.tflite

dependency_overrides:
  permission_handler_android: ^13.0.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/handylingologo.png"
  min_sdk_android: 21